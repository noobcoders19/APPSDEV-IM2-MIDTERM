services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://app:8000
    depends_on:
      - app
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ""
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: cpc_admissions
      DB_USERNAME: cpc
      DB_PASSWORD: cpc_password
      FILESYSTEM_DISK: public
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage/app/public
      - ./uploads:/var/www/html/uploads:ro

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cpc_admissions
      MYSQL_USER: cpc
      MYSQL_PASSWORD: cpc_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
  app_storage:
  frontend_node_modules:
